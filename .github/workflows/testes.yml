# Roda a bateria de testes a cada alteração enviada ao GitHub (sem instalar nada: o sistema não tem dependências).
name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Bateria de testes
        run: node qa
      - name: Nomes usados sem existir
        run: node --expose-internals tools/verificar_nomes.js
