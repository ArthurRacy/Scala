<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Sistema de gestão operacional e financeira para o serviço de anestesiologia: escala, cirurgias, avaliações pré-anestésicas, horas e faturamento.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#15563f">
<!-- Política de conteúdo: só scripts do próprio sistema (nenhum CDN, nenhum
     script inline), nada de plugin, e nenhum dado sai para outro endereço.
     Estilos inline são permitidos porque os gráficos e o quadro posicionam
     elementos por atributo style. tools/servir.py manda a mesma política
     como cabeçalho HTTP, com frame-ancestors (que não vale em <meta>). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Sistema de Gestão e Escala de Anestesia</title>

<link rel="icon" type="image/png" href="public/logo.png">

<link rel="preload" href="public/fonts/inter-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
</head>

<noscript>
  <div style="max-width:620px;margin:56px auto;padding:24px;font:14px/1.6 system-ui,sans-serif;
              border:1px solid #e3e7ec;border-radius:14px;background:#fff">
    <h1 style="font-size:19px;margin:0 0 10px">JavaScript desativado</h1>
    <p style="margin:0">Este sistema faz todos os cálculos no próprio navegador, sem enviar dado nenhum
    para fora. Para isso o JavaScript precisa estar ativado.</p>
  </div>
</noscript>
